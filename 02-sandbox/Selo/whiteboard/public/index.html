<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ortak Çizim Tahtası</title>
    <style>
        body {
            margin: 0;
            background-color: #1e1e2e;
            color: #cdd6f4;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        .toolbar {
            background: #313244;
            padding: 10px 20px;
            border-radius: 8px;
            margin-bottom: 12px;
            display: flex;
            gap: 15px;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        canvas {
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
            cursor: crosshair;
        }
        button {
            background: #f38ba8;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            color: #11111b;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { opacity: 0.9; }
    </style>
</head>
<body>

    <div class="toolbar">
        <label>Renk: <input type="color" id="colorPicker" value="#000000"></label>
        <label>Kalınlık: <input type="range" id="sizePicker" min="1" max="20" value="4"></label>
        <button id="clearBtn">Tahtayı Temizle</button>
    </div>

    <!-- Farklı ekranlarda kayma olmaması için sabit çözünürlük veriyoruz -->
    <canvas id="board" width="1000" height="600"></canvas>

    <!-- Sunucunun sunduğu Socket.io istemci kütüphanesi -->

    <script src="client.js"></script>
</body>
</html>

</html>
